<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.0//EN" "http://www.w3.org/TR/2001/REC-SVG-20010904/DTD/svg10.dtd">
<svg width="843.33" height="708.00" xmlns="http://www.w3.org/2000/svg">
<rect width="843.33" height="708.00" fill="#1a1b26" x="0.00px" y="0.00px"/>
<g font-family="SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="14.00px" fill="#c4c4c4" clip-path="url(#terminalMask)"><rect fill="#303030" x="5.00px" y="360.84px" height="17.80px" width="620.83333px"/><rect fill="#303030" x="555.00px" y="344.04px" height="17.80px" width="179.16667px"/><rect fill="#303030" x="146.67px" y="226.44px" height="17.80px" width="229.16667px"/><rect fill="#303030" x="446.67px" y="176.04px" height="17.80px" width="345.83333px"/><rect fill="#303030" x="263.33px" y="159.24px" height="17.80px" width="562.50000px"/><rect fill="#303030" x="96.67px" y="142.44px" height="17.80px" width="720.83333px"/>
<text x="5.00px" y="21.80px" xml:space="preserve"><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#ff5faf">Review #999 roborev (codex: gpt-5.5)</tspan><tspan xml:space="preserve"/></text><text x="5.00px" y="38.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#949494">/repos/roborev 8398fe8 on integrate-docs</tspan></text><text x="5.00px" y="55.40px" xml:space="preserve"><tspan xml:space="preserve" fill="#ff0000">Verdict: Fail </tspan><tspan xml:space="preserve" fill="#949494">[174.8k ctx · 14.2k out · ~$2.28]</tspan></text><text x="5.00px" y="72.20px" xml:space="preserve"/><text x="5.00px" y="89.00px" xml:space="preserve"><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#00afff">## Review Findings</tspan><tspan xml:space="preserve"/></text><text x="5.00px" y="105.80px" xml:space="preserve"/><text x="5.00px" y="122.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#d0d0d0">• </tspan><tspan xml:space="preserve">Severity</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#d0d0d0">: Medium</tspan></text><text x="5.00px" y="139.40px" xml:space="preserve"><tspan xml:space="preserve" fill="#d0d0d0">• </tspan><tspan xml:space="preserve">Location</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#d0d0d0">: docs/screenshots/prepare-demo-db.sh:252</tspan></text><text x="5.00px" y="156.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#d0d0d0">• </tspan><tspan xml:space="preserve">Problem</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#d0d0d0">: </tspan><tspan xml:space="preserve" fill="#ff5f5f">docs-review-0001</tspan><tspan xml:space="preserve" fill="#d0d0d0"> style refs are assigned to commit-backed review jobs, but the TUI/CLI</tspan></text><text x="5.00px" y="173.00px" xml:space="preserve"><tspan xml:space="preserve" fill="#d0d0d0">render commit job refs through </tspan><tspan xml:space="preserve" fill="#ff5f5f">shortJobRef</tspan><tspan xml:space="preserve" fill="#d0d0d0">, which truncates them to the first seven characters. In</tspan></text><text x="5.00px" y="189.80px" xml:space="preserve"><tspan xml:space="preserve" fill="#d0d0d0">screenshots, these rows will render as the identical </tspan><tspan xml:space="preserve" fill="#ff5f5f">docs-re</tspan><tspan xml:space="preserve" fill="#d0d0d0">, losing the per-job metadata this</tspan></text><text x="5.00px" y="206.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#d0d0d0">change is trying to curate.</tspan></text><text x="5.00px" y="223.40px" xml:space="preserve"><tspan xml:space="preserve" fill="#d0d0d0">• </tspan><tspan xml:space="preserve">Fix</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#d0d0d0">: Use deterministic SHA-like refs with unique leading seven characters, or update the display</tspan></text><text x="5.00px" y="240.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#d0d0d0">path to preserve </tspan><tspan xml:space="preserve" fill="#ff5f5f">docs-review-*</tspan><tspan xml:space="preserve" fill="#d0d0d0"> fixture refs.</tspan></text><text x="5.00px" y="257.00px" xml:space="preserve"/><text x="5.00px" y="273.80px" xml:space="preserve"><tspan xml:space="preserve" fill="#585858">--------</tspan></text><text x="5.00px" y="290.60px" xml:space="preserve"/><text x="5.00px" y="307.40px" xml:space="preserve"><tspan xml:space="preserve" fill="#d0d0d0">• </tspan><tspan xml:space="preserve">Severity</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#d0d0d0">: Medium</tspan></text><text x="5.00px" y="324.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#d0d0d0">• </tspan><tspan xml:space="preserve">Location</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#d0d0d0">: docs/assets/hydrate-assets.sh:100</tspan></text><text x="5.00px" y="341.00px" xml:space="preserve"><tspan xml:space="preserve" fill="#d0d0d0">• </tspan><tspan xml:space="preserve">Problem</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#d0d0d0">: Hydration still returns before fetching/resolving the asset branch whenever the ignored</tspan></text><text x="5.00px" y="357.80px" xml:space="preserve"><tspan xml:space="preserve" fill="#d0d0d0">target directory already contains the expected filenames. A stale </tspan><tspan xml:space="preserve" fill="#ff5f5f">docs/assets/static</tspan><tspan xml:space="preserve" fill="#d0d0d0"> or</tspan></text><text x="5.00px" y="374.60px" xml:space="preserve"><tspan xml:space="preserve" fill="#ff5f5f">docs/assets/generated</tspan><tspan xml:space="preserve" fill="#d0d0d0"> with the expanded file set will continue to be used.</tspan></text><text x="5.00px" y="391.40px" xml:space="preserve"><tspan xml:space="preserve" fill="#d0d0d0">• </tspan><tspan xml:space="preserve">Fix</tspan><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#d0d0d0">: Resolve/fetch the branch before this short-circuit and rehydrate from that ref by default,</tspan></text><text x="5.00px" y="408.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#d0d0d0">reserving the early return for an explicit local/offline mode.</tspan></text><text x="5.00px" y="425.00px" xml:space="preserve"/><text x="5.00px" y="441.80px" xml:space="preserve"><tspan xml:space="preserve"/><tspan xml:space="preserve" fill="#00afff">## Summary</tspan><tspan xml:space="preserve"/></text><text x="5.00px" y="458.60px" xml:space="preserve"/><text x="5.00px" y="475.40px" xml:space="preserve"><tspan xml:space="preserve" fill="#d0d0d0">The change expands docs asset validation and rewrites screenshot demo metadata, but the new fixture</tspan></text><text x="5.00px" y="492.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#d0d0d0">refs collapse in rendered views and asset hydration can still silently use stale media.</tspan></text><text x="5.00px" y="509.00px" xml:space="preserve"/><text x="5.00px" y="525.80px" xml:space="preserve"/><text x="5.00px" y="542.60px" xml:space="preserve"/><text x="5.00px" y="559.40px" xml:space="preserve"/><text x="5.00px" y="576.20px" xml:space="preserve"/><text x="5.00px" y="593.00px" xml:space="preserve"/><text x="5.00px" y="609.80px" xml:space="preserve"/><text x="5.00px" y="626.60px" xml:space="preserve"/><text x="5.00px" y="643.40px" xml:space="preserve"/><text x="5.00px" y="660.20px" xml:space="preserve"><tspan xml:space="preserve" fill="#949494">p </tspan><tspan xml:space="preserve" fill="#585858">prompt  </tspan><tspan xml:space="preserve" fill="#666666">▕ </tspan><tspan xml:space="preserve" fill="#949494">c </tspan><tspan xml:space="preserve" fill="#585858">comment    </tspan><tspan xml:space="preserve" fill="#666666">▕ </tspan><tspan xml:space="preserve" fill="#949494">m </tspan><tspan xml:space="preserve" fill="#585858">commit  </tspan><tspan xml:space="preserve" fill="#666666">▕ </tspan><tspan xml:space="preserve" fill="#949494">a </tspan><tspan xml:space="preserve" fill="#585858">close </tspan><tspan xml:space="preserve" fill="#666666">▕ </tspan><tspan xml:space="preserve" fill="#949494">y </tspan><tspan xml:space="preserve" fill="#585858">copy</tspan></text><text x="5.00px" y="677.00px" xml:space="preserve"><tspan xml:space="preserve" fill="#949494">↑/↓ </tspan><tspan xml:space="preserve" fill="#585858">scroll</tspan><tspan xml:space="preserve" fill="#666666">▕ </tspan><tspan xml:space="preserve" fill="#949494">←/→ </tspan><tspan xml:space="preserve" fill="#585858">prev/next</tspan><tspan xml:space="preserve" fill="#666666">▕ </tspan><tspan xml:space="preserve" fill="#949494">? </tspan><tspan xml:space="preserve" fill="#585858">commands</tspan><tspan xml:space="preserve" fill="#666666">▕ </tspan><tspan xml:space="preserve" fill="#949494">esc </tspan><tspan xml:space="preserve" fill="#585858">back</tspan></text>
</g>
</svg>
